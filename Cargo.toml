[workspace]
members = [
    "crates/crypto-core",
    "crates/crypto-isolation",
    "crates/keystore-core",
    "crates/ipc-protocol",
    "crates/wallet-plugin",
    "crates/plugin-manifest",
    "crates/ipc-core",
    "crates/tor-daemon",
    "crates/auth-core",
    "crates/vault-core",
    "crates/plugins/btc",
    "crates/plugins/evm",
    "crates/plugins/xmr",
    "crates/extension-relay",
    "apps/desktop/src-tauri",
    "apps/cli",
    "crates/plugins/ltc",
    "crates/update-checker",
    "fuzz",
    "tests/cli-integration",
]
resolver = "2"

[workspace.package]
version = "0.0.2"
edition = "2024"
# SOURCE-AVAILABLE during beta/testing (BSL-1.1); converts to Apache-2.0 at
# v1.0. Do NOT relicense to a permissive license before the Change Date.
license = "BUSL-1.1"
repository = "https://github.com/MarcusBrammeier/gullbur-enclave"

[workspace.dependencies]
aes-gcm = ">=0.10,<1"
argon2 = "0.5"
sha2 = ">=0.10,<1"
sha3 = ">=0.10,<1"
ripemd = ">=0.1,<1"
hkdf = ">=0.12,<1"
hex = ">=0.4,<1"
hmac = ">=0.12,<1"
zeroize = { version = ">=1.8,<2", features = ["zeroize_derive"] }
async-trait = ">=0.1,<1"
k256 = { version = ">=0.14,<0.15", features = ["ecdsa", "schnorr"] }
ed25519-dalek = { version = ">=2.2,<3" }
curve25519-dalek = { version = ">=4.1,<6" }
bitcoin = { version = ">=0.32,<0.33", features = ["rand"] }
bip39 = { version = ">=2.1,<3" }
bip32 = { version = ">=0.5,<0.6", features = ["k256"] }
base58ck = ">=0.1,<0.2"
serde = { version = ">=1,<2", features = ["derive"] }
serde_json = ">=1,<2"
tokio = { version = ">=1,<2", features = ["full"] }
tokio-tungstenite = ">=0.27,<0.28"
rand = ">=0.9,<0.10"
keyring = { version = ">=3,<4" }
thiserror = { version = ">=2,<3" }
tracing = { version = ">=0.1,<1" }
reqwest = { version = ">=0.12,<1", default-features = false, features = ["json", "rustls-tls"] }

[workspace.lints.rust]
unsafe_code = "warn"
unused_must_use = "deny"
unused_unsafe = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Android-arm64: size-optimized native lib
# (lto/codegen-units/panic come from the workspace [profile.release] block)
[profile.release.package.gullbur-desktop]
opt-level = "z"
strip = true

[profile.dev]
opt-level = 1
strip = "debuginfo"