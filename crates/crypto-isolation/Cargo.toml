[package]
name = "crypto-isolation"
version = "0.0.2"
edition = "2024"
license.workspace = true
description = "Minimal AES-256-GCM isolation crypto — no native deps, compiles to WASM"

[dependencies]
aes-gcm = ">=0.10,<1"
base64 = "0.23.1"
serde = { version = ">=1,<2", features = ["derive"] }
serde_json = ">=1,<2"
hex = ">=0.4,<1"
rand = ">=0.9,<0.10"

[dev-dependencies]
proptest = "1"