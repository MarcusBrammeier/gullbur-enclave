[package]
name = "crypto-wasm"
version = "0.1.0"
edition = "2024"
description = "WASM compilation target for Gullbúr Enclave AES-256-GCM isolation crypto"

[package.metadata.wasm-pack]
wasm-opt = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
crypto-isolation = { path = "../crypto-isolation" }
wasm-bindgen = ">=0.2,<1"
serde = { version = ">=1,<2", features = ["derive"] }
serde_json = ">=1,<2"
hex = ">=0.4,<1"
aes-gcm = ">=0.10,<1"
getrandom = { version = ">=0.3,<1", features = ["wasm_js"] }

[profile.release]
opt-level = "s"    # optimize for size (WASM)
lto = true
panic = "abort"
strip = "symbols"