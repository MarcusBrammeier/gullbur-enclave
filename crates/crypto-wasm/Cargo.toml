[package]
name = "crypto-wasm"
version = "0.0.2"
edition = "2024"
description = "WASM compilation target for Gullbúr Enclave AES-256-GCM isolation crypto"

[package.metadata.wasm-pack]

[lib]
crate-type = ["cdylib"]

[dependencies]
crypto-isolation = { path = "../crypto-isolation" }
wasm-bindgen = ">=0.2,<1"
serde = { version = ">=1,<2", features = ["derive"] }
serde_json = ">=1,<2"
hex = ">=0.4,<1"
aes-gcm = ">=0.10,<1"
getrandom = { version = "0.4", features = ["wasm_js"] }
# rand_core 0.9 (dep of rand) pulls in getrandom 0.3.x which needs its own
# wasm_js feature — Cargo can't unify features across semver-incompatible
# versions from a single dep spec, so we add both explicitly.
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[profile.release]
opt-level = "s"    # optimize for size (WASM)
lto = true
panic = "abort"
strip = "symbols"