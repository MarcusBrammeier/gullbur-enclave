[package]
name = "extension-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "EIP-6963 browser extension relay — native messaging host, method router, permission manager"

[[bin]]
name = "gullbur-relay"
path = "src/main.rs"

[dependencies]
ipc-protocol = { path = "../ipc-protocol" }
wallet-plugin = { path = "../wallet-plugin" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = ">=0.3,<1"
tokio-tungstenite = { workspace = true }
futures-util = ">=0.3,<1"
clap = { version = ">=4,<5", features = ["derive"] }

[dev-dependencies]
auth-core = { path = "../auth-core" }
tokio = { workspace = true }
vault-core = { path = "../vault-core" }
ipc-core = { path = "../ipc-core" }
zeroize = { workspace = true }
