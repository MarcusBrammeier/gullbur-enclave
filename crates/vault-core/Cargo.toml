[package]
name = "vault-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Headless vault engine — plugin host, crypto orchestrator, IPC lifecycle"

[dependencies]
async-trait = { workspace = true }
crypto-core = { path = "../crypto-core" }
keystore-core = { path = "../keystore-core" }
ipc-protocol = { path = "../ipc-protocol" }
wallet-plugin = { path = "../wallet-plugin" }
ipc-core = { path = "../ipc-core" }
tor-daemon = { path = "../tor-daemon" }
auth-core = { path = "../auth-core" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
dirs-next = "2"
tokio-tungstenite = { workspace = true }
futures-util = ">=0.3,<1"
rand = { workspace = true }
reqwest = { workspace = true }
bzip2 = ">=0.5,<1"
tar = ">=0.4,<1"
sha2 = { workspace = true }

[features]
plugins = [
    "plugin-btc",
    "plugin-evm",
    "plugin-xmr",
    "plugin-ltc",
]

[dependencies.plugin-btc]
path = "../plugins/btc"
optional = true

[dependencies.plugin-evm]
path = "../plugins/evm"
optional = true

[dependencies.plugin-xmr]
path = "../plugins/xmr"
optional = true

[dependencies.plugin-ltc]
path = "../plugins/ltc"
optional = true