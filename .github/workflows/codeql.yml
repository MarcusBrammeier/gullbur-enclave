# CodeQL static security analysis
# Runs on every PR + weekly; scans the Rust + TS codebase for vulnerabilities.
name: "CodeQL"

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: '0 4 * * 1'  # weekly Monday 04:00 UTC

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [ 'rust', 'javascript-typescript' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Install Rust toolchain (for Rust analysis)
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system deps (Rust)
        if: matrix.language == 'rust'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev libglib2.0-dev \
            libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libgdk-pixbuf-2.0-dev pkg-config

      - name: Build frontend (Rust needs dist/)
        if: matrix.language == 'rust'
        run: |
          cd apps/desktop
          npm ci
          npm run build

      - name: Build dependency (Rust)
        if: matrix.language == 'rust'
        run: cargo check --workspace --locked

      - name: Setup Node (for JS/TS analysis)
        if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"
