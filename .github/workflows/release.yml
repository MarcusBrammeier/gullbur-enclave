name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev libglib2.0-dev \
            libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libgdk-pixbuf-2.0-dev pkg-config
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Build frontend (dist/)
        run: |
          cd apps/desktop
          npm ci
          npm run build
      - name: cargo deny check
        run: cargo deny check
      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings -D clippy::unwrap_used
      - name: cargo test
        run: cargo test --workspace --lib
      - name: cargo test (cli-integration)
        run: cargo test -p cli-integration -- --test-threads=1

  build:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Install system deps (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
      - name: Build .deb
        run: cargo tauri build --bundles deb
        working-directory: apps/desktop
      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: gullbur-deb
          path: apps/desktop/target/release/bundle/deb/*.deb
      - name: Build .AppImage
        run: cargo tauri build --bundles appimage
        working-directory: apps/desktop
      - name: Upload .AppImage
        uses: actions/upload-artifact@v4
        with:
          name: gullbur-appimage
          path: apps/desktop/target/release/bundle/appimage/*.AppImage

  android:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          targets: aarch64-linux-android
      - name: Install Android SDK/NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install npm deps
        run: npm ci
        working-directory: apps/desktop
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"
      - name: Build Release APK
        run: npx tauri android build --target aarch64
        working-directory: apps/desktop
        env:
          CC_aarch64_linux_android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android-clang
          AR_aarch64_linux_android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android-clang
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gullbur-apk-arm64
          path: apps/desktop/src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk