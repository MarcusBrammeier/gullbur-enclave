name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny check
        run: cargo deny check
      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings
      - name: cargo test
        run: cargo test --workspace --lib

  build:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Install system deps (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
      - name: Build .deb
        run: cargo tauri build --bundles deb
        working-directory: apps/desktop
      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: gullbur-deb
          path: apps/desktop/target/release/bundle/deb/*.deb
      - name: Build .AppImage
        run: cargo tauri build --bundles appimage
        working-directory: apps/desktop
      - name: Upload .AppImage
        uses: actions/upload-artifact@v4
        with:
          name: gullbur-appimage
          path: apps/desktop/target/release/bundle/appimage/*.AppImage