name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Tauri v2 Linux build deps (glib, webkit2gtk, GTK3, etc.) — the runner
      # is a bare ubuntu-latest and lacks these system libraries.
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libgdk-pixbuf-2.0-dev \
            pkg-config

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check --workspace

      - name: cargo test (lib)
        run: cargo test --workspace --lib

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy (unwrap gate)
        run: cargo clippy --workspace --lib -- -D clippy::unwrap_used -A warnings

      - name: cargo deny check
        run: cargo deny check

      - name: cargo test (cli-integration)
        run: cargo test -p cli-integration -- --test-threads=1