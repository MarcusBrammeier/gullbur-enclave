name: Release (macOS)

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build frontend (dist/)
        run: |
          cd apps/desktop
          npm ci
          npm run build
      - name: cargo deny check
        run: cargo deny check
      - name: cargo clippy
        run: cargo clippy --workspace --locked -- -D warnings
      - name: cargo test
        run: cargo test --workspace --lib --locked

  build:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend (Svelte)
        run: |
          cd apps/desktop
          npm ci
          npm run build

      - name: Build .dmg
        run: cargo tauri build --bundles dmg
        working-directory: apps/desktop

      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: gullbur-dmg
          path: apps/desktop/target/release/bundle/dmg/*.dmg