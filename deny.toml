[graph]
all-features = false
no-default-features = false
exclude-dev = true

[output]
feature-depth = 1

[advisories]
# All ignores below are `informational = "unmaintained"` only — NO security
# vulnerabilities (no CVEs / CVSS). Reviewed 2026-08-17:
#   - RUSTSEC-2024-0370..0420: gtk-rs GTK3 bindings (gtk/gdk/atk + -sys,
#     gtk3-macros, proc-macro-error) — transitive build-time UI deps of the
#     Tauri desktop shell. GTK3 line is archived upstream; bindings don't handle
#     untrusted data. Low risk.
#   - RUSTSEC-2025-0075..0100: `unic-*` Unicode utility crates, unmaintained.
#     Functionality now covered by Rust stdlib. Purely additive, no risk.
# Revisit if a real CVE appears in any of these.
ignore = [
    "RUSTSEC-2024-0370",
    "RUSTSEC-2024-0411",
    "RUSTSEC-2024-0412",
    "RUSTSEC-2024-0413",
    "RUSTSEC-2024-0414",
    "RUSTSEC-2024-0415",
    "RUSTSEC-2024-0416",
    "RUSTSEC-2024-0417",
    "RUSTSEC-2024-0418",
    "RUSTSEC-2024-0419",
    "RUSTSEC-2024-0420",
    "RUSTSEC-2025-0075",
    "RUSTSEC-2025-0080",
    "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0098",
    "RUSTSEC-2025-0100",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unlicense",
    "CC0-1.0",
    "0BSD",
    "MIT-0",
    "MITNFA",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "bzip2-1.0.6",
    "NCSA",
    "BUSL-1.1",
]
confidence-threshold = 0.5

[licenses.private]
# Workspace crates are our own source (not third-party deps). Their license
# (BUSL-1.1 during beta) is intentional and not checked — deny only gates
# third-party dependency licenses.
ignore = true
registries = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow-workspace = false
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []