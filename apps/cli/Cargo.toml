[package]
name = "gullbur-cli"
version = "0.0.7"
edition = "2024"
license.workspace = true
description = "Gullbúr Enclave — Internal CLI for testing without the desktop shell (PRO/ENTERPRISE feature)"

[dependencies]
clap = { version = ">=4,<5", features = ["derive"] }
tokio = { version = ">=1,<2", features = ["full"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
serde = { version = ">=1,<2", features = ["derive"] }
serde_json = ">=1,<2"
hex = "0.4"
rand = "0.8"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Headless vault mode
vault-core = { path = "../../crates/vault-core", optional = true }
auth-core = { path = "../../crates/auth-core", optional = true }
ipc-core = { path = "../../crates/ipc-core", optional = true }
plugin-btc = { path = "../../crates/plugins/btc", optional = true }
plugin-evm = { path = "../../crates/plugins/evm", optional = true }
plugin-xmr = { path = "../../crates/plugins/xmr", optional = true }
plugin-ltc = { path = "../../crates/plugins/ltc", optional = true }
zeroize = { workspace = true, optional = true }

[features]
default = []
headless = [
    "vault-core", "auth-core", "ipc-core",
    "plugin-btc", "plugin-evm", "plugin-xmr", "plugin-ltc",
    "zeroize",
]